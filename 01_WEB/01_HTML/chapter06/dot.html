<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 250px;
        height: 150px;
        border: 3px solid black;
        position: relative;
      }

      .circle {
        position: absolute;
        width: 50px;
        height: 50px;
        border-radius: 50%;
      }

      #red {
        background-color: red;
        top: 10px;
        left: 10px;
      }
      #green {
        background-color: green;
        top: 10px;
        right: 10px;
      }
      #yello {
        background-color: yellow;
        bottom: 10px;
        left: 10px;
      }
      #blue {
        background-color: blue;
        bottom: 10px;
        right: 10px;
      }
    </style>
  </head>
  <body>
    <h2>절대 위치를 사용한 요소 배치</h2>
    <div class="box">
      <div class="circle" id="red"></div>
      <div class="circle" id="green"></div>
      <div class="circle" id="yello"></div>
      <div class="circle" id="blue"></div>
    </div>
    <h2>안녕하세요?</h2>
  </body>
</html>
