<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .imgDiv {
        border: 1px solid red;
        width: 150px;
        height: 150px;
        overflow: hidden;
        margin: 100px auto;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .imgDiv:hover img {
        transform: scale(1.1);
      }
      .imgDiv img {
        transition: all 0.2s linear;
      }
      /* transform: scale
    - box안의 이미지를 확대할 때 사용한다.

    transition
    - 시간의 흐름을 줘서 부드럽게 확대되도록 설정한다.
    - ease : 기본값, 느리게 시작해서 빠르게 전환한 다음 다시 천천히 종료
    linear : 처음부터 끝까지 같은 속도로 전환 */
    </style>
  </head>
  <body>
    <div class="imgDiv">
      <img src="images/망상토끼.gif" alt="망상토끼" />
    </div>
  </body>
</html>
