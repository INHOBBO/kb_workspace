<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      span {
        /* display: none;  빈칸이 생기고 영역은 없음 */
        visibility: hidden; /* 빈칸이 생기면서 영역도 잡음 */
      }
      li:hover span {
        visibility: visible;
        color: red;
      }
    </style>
  </head>
  <body>
    <h3>다음 빈 곳에 숨은 단어?</h3>
    <hr />
    <ul>
      <li>I (<span>love</span>) you.</li>
      <li>CSS is Cascading (<span>Style</span>) Sheet.</li>

      <li>응답하라 (<span>1988</span>).</li>
    </ul>
  </body>
</html>
