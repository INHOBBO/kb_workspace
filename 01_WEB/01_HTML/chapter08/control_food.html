<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      window.onload = function () {
        let btn = document.getElementById('btn');

        btn.onclick = function () {
          let selectFoods = document.querySelectorAll(
            'input[name="food"]:checked',
          );

          for (let i = 0; i < selectFoods.length; i++) {
            console.log(selectFoods[i].value);
          }
        };
      };
    </script>
  </head>
  <body>
    <form>
      <div>
        <h1>좋아하는 음식은?</h1>
        <label><input type="checkbox" name="food" value="라면" />라면</label>
        <label><input type="checkbox" name="food" value="만두" />만두</label>
        <label
          ><input type="checkbox" name="food" value="불고기" />불고기</label
        >
        <input id="btn" type="button" value="전송" />
      </div>
    </form>
  </body>
</html>
