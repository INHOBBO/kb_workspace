<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function make1() {
        console.log('have a nice day.');
      }
      //호출
      make1();

      // 화살표 함수 ver1.
      const make11 = () => console.log('have a wonderful day.');
      make11();

      // 화살표 함수 ver2.
      function make2(num) {
        console.log(`num = ${num}`);
      }
      make2(3);

      const make22 = (num) => console.log(`num = ${num}`);
      make22(3);

      // 화살표 함수 ver3.
      function make3(a, b) {
        console.log(`a + b = ${a + b}`);
      }
      make3(3, 4);

      const make33 = (a, b) => console.log(`a + b = ${a + b}`);
      make33(3, 4);
    </script>
  </body>
</html>
